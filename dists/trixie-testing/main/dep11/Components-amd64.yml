ID: io.github.dvbondoy.flickos.kits.python
Package: flickos-kit-python
Extends:
- flickos-kits.desktop
ProjectLicense: GPL-3.0-or-later
Name:
  C: Python
Summary:
  C: Virtual environments, pip and pipx for Python projects
Description:
  C: >-
    <p>
          What a Python project needs on top of the Python that FlickOS already has:
          virtual environments, the headers to build extensions, pip and pipx.
        </p>
    <p>
          Debian keeps pip out of the system's own Python on purpose, so pip works
          inside a virtual environment (python3 -m venv), and pipx installs command-
          line programs of their own.
        </p>
