Extends:
- flickos-kits.desktop
ProjectLicense: GPL-3.0-or-later
Name:
  C: Passwords
Summary:
  C: John the Ripper, hashcat and Hydra for testing passwords
Description:
  C: >-
    <p>
          John the Ripper, hashcat, Hydra, Medusa, crunch, fcrackzip,
          pdfcrack and hashID from Debian.
        </p>
    <p>
          hashcat runs on the processor as installed. To use a graphics
          card, install its maker's OpenCL driver, or mesa-opencl-icd and
          set RUSTICL_ENABLE for the card's driver. Debian has no
          wordlists, so none come with the kit.
        </p>
