Package: flickos-kit-web
Extends:
- flickos-kits.desktop
ProjectLicense: GPL-3.0-or-later
Name:
  C: Node.js and npm
Summary:
  C: Node.js and npm for web and JavaScript projects
Description:
  C: >-
    <p>
          Node.js and npm from Debian, with the packages Debian's npm needs (a few
          hundred small libraries).
        </p>
    <p>
          Debian 13 has Node 20, which the Node project stopped supporting in April
          2026. It still gets Debian's security fixes, but a project that needs a
          newer Node will not find it here.
        </p>
