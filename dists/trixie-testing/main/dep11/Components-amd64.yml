Name:
  C: Developer Basics
Summary:
  C: Git, a compiler and the everyday command-line tools
Description:
  C: >-
    <p>
          The tools most programmers reach for first: git, the GNU compiler and
          make, the gdb debugger, curl, jq, ripgrep, fd, shellcheck, sqlite3 and
          GitHub's gh.
        </p>
    <p>
          The other developer kits build on this one, so it is installed with them.
          Nothing runs in the background.
        </p>
