ID: io.github.dvbondoy.flickos.kits.wireless
Package: flickos-kit-wireless
Extends:
- flickos-kits.desktop
ProjectLicense: GPL-3.0-or-later
Name:
  C: Wireless Testing
Summary:
  C: Aircrack-ng and the tools for testing Wi-Fi networks
Description:
  C: >-
    <p>
          Aircrack-ng, Reaver, Wifite, hcxdumptool and hcxtools, iw and
          macchanger from Debian. They need administrator rights and an
          adapter that can do monitor mode.
        </p>
    <p>
          Use a second, USB adapter and start it with airmon-ng start
          alone. airmon-ng check kill stops this computer's own network;
          if you ran it, sudo systemctl start NetworkManager brings it
          back.
        </p>
