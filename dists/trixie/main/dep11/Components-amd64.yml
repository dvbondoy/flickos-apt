ID: io.github.dvbondoy.flickos.styles.Eleven
Package: flickos-style-eleven
Extends:
- flickos-layout.desktop
ProjectLicense: GPL-3.0-or-later
Name:
  C: Eleven
Summary:
  C: Dark grey windows, a dark panel with the apps in the middle
Description:
  C: >-
    <p>
          A dark style for the FlickOS desktop: neutral dark grey windows and
          title bars with wide, flat buttons drawn in thin lines (close turns red
          under the pointer), a sky blue accent, a near-black terminal, and folds
          of blue light on a deep blue wallpaper.
        </p>
    <p>
          It comes with a layout of the same name: one see-through dark panel at
          the bottom with the apps button and your open windows in the middle, a
          line under each window and a blue one under the window you are using,
          and the status icons and a two-line clock at the right. The start menu
          opens above the middle of the panel. Use sets both; you can still pick
          another layout in Settings.
        </p>
