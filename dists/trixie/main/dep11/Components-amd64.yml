Type: desktop-application
ID: io.github.dvbondoy.flickos.Notes
Package: flickos-notes
ProjectLicense: LicenseRef-proprietary
Name:
  C: Notes
Summary:
  C: Notes and checklists in plain Markdown files
Description:
  C: >-
    <p>Write notes and checklists, tag them with #words in the text, and find any note by its words or tags. Typing is saved
    by itself.</p>

    <p>Every note is a plain Markdown file in a folder you can see (Documents/Notes by default), so any editor, backup or
    sync tool can use it.</p>

    <p>A checklist is a Markdown task list: click a box to tick it, and the list of notes shows how many items are left. With
    a phone paired in Settings, Continue on Phone sends a note to it. Nothing runs while the window is closed.</p>

    <p>Free of charge until the FlickOS store opens.</p>
