Description:
  C: >-
    <p>
          The Sleuth Kit and Autopsy, binwalk, foremost, scalpel,
          TestDisk, dc3dd, the EWF tools, hashdeep, YARA, ExifTool and
          steghide from Debian.
        </p>
    <p>
          Autopsy is the older web version: it listens on this computer
          only, while it runs. dc3dd and ewfacquire image disks from the
          command line. Guymager isn't part of the kit, because the disk
          tools it brings start a service; Software installs it on its
          own.
        </p>
