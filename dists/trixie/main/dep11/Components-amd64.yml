Type: desktop-application
ID: io.github.dvbondoy.flickos.Write
Package: flickos-write
ProjectLicense: LicenseRef-proprietary
Name:
  C: Write
Summary:
  C: Write books, stories and letters with nothing else on the screen
Description:
  C: >-
    <p>Write books, stories and letters in plain Markdown files. A folder is a project and its files are the chapters, in
    the order of their numbers. Any other folder or Markdown file opens where it is.</p>

    <p>A writing session fills the screen with the page and holds notifications. The line being written stays in the middle,
    the rest of the text can be dimmed, and a daily goal counts the words written today. Typing is saved by itself.</p>

    <p>With a phone paired in Settings, a chapter can be continued on the phone and comes back to the computer when it is
    done. Nothing runs while the window is closed.</p>

    <p>Free of charge until the FlickOS store opens.</p>
