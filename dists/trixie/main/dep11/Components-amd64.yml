ID: io.github.dvbondoy.flickos.kits.network
Package: flickos-kit-network
Extends:
- flickos-kits.desktop
ProjectLicense: GPL-3.0-or-later
Name:
  C: Network Analysis
Summary:
  C: Wireshark, Nmap and the tools for looking at a network
Description:
  C: >-
    <p>
          Nmap, Wireshark and tshark, tcpdump, arp-scan, Ettercap and
          bettercap from Debian, with the everyday tools for networks:
          ncat, socat, dig, whois, traceroute, mtr, iperf3, ngrep,
          tcpflow, and the SMB, LDAP, NetBIOS and SNMP clients.
        </p>
    <p>
          Capturing packets needs administrator rights as Debian installs
          it: Wireshark lists no interfaces until your account may capture
          (sudo dpkg-reconfigure wireshark-common, add yourself to the
          wireshark group and log in again). Raw scans stay sudo nmap.
        </p>
