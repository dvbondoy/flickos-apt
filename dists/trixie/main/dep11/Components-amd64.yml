  C: >-
    <p>
          A light style for the FlickOS desktop: windows in one light grey with the
          title in the middle and plain buttons, a see-through dark top bar with
          white text, a dark slate terminal and a seashore seen from above.
        </p>
    <p>
          It comes with a layout of the same name: a thin top bar with Applications
