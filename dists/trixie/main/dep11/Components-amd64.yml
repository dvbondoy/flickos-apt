Type: desktop-application
ID: io.github.dvbondoy.flickos.PhoneScreen
Package: flickos-phone-screen
ProjectLicense: LicenseRef-proprietary AND Apache-2.0
Name:
  C: Phone Screen
Summary:
  C: Use your Android phone's apps from this computer
Description:
  C: >-
    <p>The phone's screen shows in a window, where the computer's mouse, keyboard and clipboard work on the phone. Pairing
    goes over Wi-Fi with the six digits the phone shows, without a cable or a terminal, and the phone is found on the network
    by itself.</p>

    <p>The other way round, a tablet or phone can be a second screen for the computer: Use as Second Screen sends it a link
    that opens the screen in the AVNC app, over an encrypted connection with a new password every time.</p>

    <p>Needs a phone paired in Settings (the KDE Connect app) and Android 11 or newer with Developer options. Nothing runs
    while the screen isn't shown. It uses scrcpy.</p>

    <p>Free of charge until the FlickOS store opens.</p>
